# The IC layer: who sits inside every pod.
#
# This file, together with sectors.yaml, IS the org chart. The generator
# (crews/gen_members.py) crosses them: every pod in sectors.yaml gets a line
# manager plus one row per role listed here. Nothing about the team composition
# lives in code -- delete the debate, add a macro hedger, cut the analysts from
# four to two, and the org chart, the Desk page and the per-role progress columns
# all follow.
#
# Copy this to $DESK_ROOT/roles.yaml to change your own desk. The app falls back
# to this example when that file is absent, so a fresh clone runs.
#
# Order matters: it is the order the Desk page lists a pod's members in, and it
# should read as the pipeline -- research, then debate, then a proposal, then
# review.
#
# Per role:
#   role        id suffix. Lowercase, dashes. The member id becomes
#               ic-<pod>-<role>, so this must be unique within the file.
#   title       ENGLISH. The UI maps a display language in ui/i18n.mjs; a title
#               written in another language here survives the language switch and
#               prints the wrong language to the other half of your readers.
#   letter      two letters for the avatar. Make them unique across the file --
#               the avatar hue is derived from them, so two roles sharing a
#               monogram share a colour and stop being tellable apart.
#   agent       the agent that runs this role. Nothing here validates that it
#               exists; a missing agent simply never produces artifacts.
#   duty        outward-facing job description: what this role produces, in the
#               words you want a reader to see. Never put orchestration internals
#               in it (sentinel strings, tool or command names, session
#               mechanics) -- that is prompt material, not UI copy.
#   artifacts   filename globs this role writes, relative to a ticker's report
#               directory. The backend folds the role's state by counting these,
#               which is why an IC needs no standing session.
#   per_ticker  how many files it owes per ticker. Use ~ (null) to scale with
#               that pod's analyst_copies.

roles:
  - role: technicals
    title: Technical Analyst
    letter: TE
    agent: tada-technicals
    duty: >-
      Price and volume only. Trend, support and resistance, momentum, unusual
      volume -- a technical read on this ticker.
    artifacts: ["technicals-copy-*.md"]
    per_ticker: ~

  - role: fundamentals
    title: Fundamental Analyst
    letter: FU
    agent: tada-fundamentals
    duty: >-
      The filings and the business. Revenue and margin, guidance, valuation -- a
      fundamental read on this ticker.
    artifacts: ["fundamentals-copy-*.md"]
    per_ticker: ~

  - role: sentiment
    title: Sentiment Analyst
    letter: SE
    agent: tada-sentiment
    duty: >-
      How the market is positioned. Flows, options open interest, retail versus
      institutional posture.
    artifacts: ["sentiment-copy-*.md"]
    per_ticker: ~

  - role: news
    title: News Analyst
    letter: NE
    agent: tada-news
    duty: >-
      What just happened. Filings, sector moves, supply chain and policy -- and
      which of them actually moves this ticker.
    artifacts: ["news-copy-*.md"]
    per_ticker: ~

  - role: bull
    title: Bull Researcher
    letter: BU
    agent: tada-bull
    duty: >-
      Argues the long side using the strongest evidence in the four analyst
      reports, and answers the bear's objections.
    artifacts: ["bull-thesis.md"]
    per_ticker: 1

  - role: bear
    title: Bear Researcher
    letter: BE
    agent: tada-bear
    duty: >-
      Argues the short side -- valuation, competition and execution risk -- and
      attacks the bull's weakest assumption.
    artifacts: ["bear-thesis.md"]
    per_ticker: 1

  - role: trader
    title: Pod Trader
    letter: TR
    agent: tada-trader-initial
    duty: >-
      Hears both sides, then proposes a direction, a size and a stop for this
      ticker, and sends it to risk review.
    artifacts: ["trade-proposal-initial.md"]
    per_ticker: 1

  - role: risk-aggressive
    title: Risk Review · Aggressive
    letter: RA
    agent: tada-risk-aggressive
    duty: >-
      Reviews the proposal for missed upside: are the odds good enough, is the
      size too timid for the setup.
    artifacts: ["risk-aggressive.md"]
    per_ticker: 1

  - role: risk-conservative
    title: Risk Review · Conservative
    letter: RC
    agent: tada-risk-conservative
    duty: >-
      Reviews the proposal for downside: what the worst case costs, whether the
      stop holds, whether the book can absorb it.
    artifacts: ["risk-conservative.md"]
    per_ticker: 1

  - role: risk-neutral
    title: Risk Review · Neutral
    letter: RN
    agent: tada-risk-neutral
    duty: >-
      Weighs the aggressive and conservative reviews against each other and lands
      one executable compromise.
    artifacts: ["risk-neutral.md"]
    per_ticker: 1
